version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: aiso_postgres
    environment:
      POSTGRES_DB: aiso
      POSTGRES_USER: aiso_user
      POSTGRES_PASSWORD: aiso_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aiso_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: