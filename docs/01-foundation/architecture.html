<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AISO-Teams — System Architecture</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
    background: #fafbfc;
    margin: 0;
    padding: 48px 24px;
    color: #1f2933;
  }
  .page {
    max-width: 1280px;
    margin: 0 auto;
    background: white;
    padding: 56px 64px;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 24px rgba(0,0,0,0.04);
  }
  .header {
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 20px;
    margin-bottom: 40px;
  }
  h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    color: #0f172a;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: #64748b;
    font-size: 13px;
    margin-top: 6px;
    font-weight: 400;
  }
  .meta {
    color: #94a3b8;
    font-size: 11px;
    margin-top: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .footer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #94a3b8;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>AISO-Teams System Architecture</h1>
    <div class="subtitle">AI-Powered Microsoft Teams Chatbot for SAP Sales Order Management</div>
    <div class="meta">Version 1.2 · June 2026</div>
  </div>

  <svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
      </marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
      </filter>
    </defs>

    <style>
      .zone { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .zone-client { fill: #faf5ff; stroke: #d8b4fe; }
      .zone-cloud { fill: #eff6ff; stroke: #93c5fd; }
      .zone-bot { fill: #f0f9ff; stroke: #7dd3fc; }
      .zone-sap { fill: #fff7ed; stroke: #fdba74; }

      .zone-title {
        font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .node {
        rx: 4; ry: 4; stroke-width: 1; filter: url(#shadow);
      }
      .n-client { fill: white; stroke: #c084fc; }
      .n-cloud { fill: white; stroke: #60a5fa; }
      .n-bot { fill: white; stroke: #38bdf8; }
      .n-data { fill: white; stroke: #94a3b8; }
      .n-sap { fill: white; stroke: #fb923c; }

      .bar { rx: 2; }
      .bar-client { fill: #a855f7; }
      .bar-cloud { fill: #3b82f6; }
      .bar-bot { fill: #0ea5e9; }
      .bar-data { fill: #64748b; }
      .bar-sap { fill: #f97316; }

      .n-title {
        font-size: 12px; font-weight: 600; fill: #0f172a;
      }
      .n-sub {
        font-size: 10px; fill: #64748b; font-weight: 400;
      }

      .edge {
        stroke: #475569; stroke-width: 1.4; fill: none;
      }
      .edge-light {
        stroke: #cbd5e1; stroke-width: 1.2; fill: none;
      }
      .edge-label {
        font-size: 10px; fill: #475569; font-weight: 500;
      }
      .edge-label-bg { fill: white; }

      .flow-badge {
        fill: #ea580c;
      }
      .flow-num {
        font-size: 10px; font-weight: 700; fill: white;
        text-anchor: middle; dominant-baseline: central;
      }
    </style>

    <!-- ============================== ZONE: CLIENT ============================== -->
    <rect x="40" y="40" width="1020" height="100" class="zone zone-client"/>
    <text x="56" y="62" class="zone-title" fill="#6b21a8">CLIENT</text>

    <!-- Microsoft Teams -->
    <g transform="translate(440, 75)">
      <rect width="220" height="50" class="node n-client"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-client"/>
      <text x="20" y="22" class="n-title">Microsoft Teams Client</text>
      <text x="20" y="38" class="n-sub">Desktop · Web · Mobile</text>
    </g>

    <!-- ============================== ZONE: CLOUD SERVICES ============================== -->
    <rect x="40" y="180" width="1020" height="180" class="zone zone-cloud"/>
    <text x="56" y="202" class="zone-title" fill="#1e40af">THIRD-PARTY CLOUD SERVICES · Microsoft 365 / Azure</text>

    <!-- Bot Service -->
    <g transform="translate(80, 220)">
      <rect width="180" height="50" class="node n-cloud"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-cloud"/>
      <text x="20" y="22" class="n-title">Azure Bot Service</text>
      <text x="20" y="38" class="n-sub">Teams Channel Connector</text>
    </g>

    <!-- Entra ID -->
    <g transform="translate(280, 220)">
      <rect width="180" height="50" class="node n-cloud"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-cloud"/>
      <text x="20" y="22" class="n-title">Microsoft Entra ID</text>
      <text x="20" y="38" class="n-sub">OAuth 2.0 · SSO</text>
    </g>

    <!-- Azure OpenAI -->
    <g transform="translate(480, 220)">
      <rect width="180" height="50" class="node n-cloud"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-cloud"/>
      <text x="20" y="22" class="n-title">Azure OpenAI</text>
      <text x="20" y="38" class="n-sub">GPT-4o · Function Calling</text>
    </g>

    <!-- Microsoft Graph -->
    <g transform="translate(680, 220)">
      <rect width="180" height="50" class="node n-cloud"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-cloud"/>
      <text x="20" y="22" class="n-title">Microsoft Graph API</text>
      <text x="20" y="38" class="n-sub">Email · Teams Messaging</text>
    </g>

    <!-- Azure Functions -->
    <g transform="translate(880, 220)">
      <rect width="160" height="50" class="node n-cloud"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-cloud"/>
      <text x="20" y="22" class="n-title">Azure Functions</text>
      <text x="20" y="38" class="n-sub">Puppeteer · PDF Engine</text>
    </g>

    <!-- Cloud caption -->
    <text x="80" y="310" class="n-sub" style="font-style:italic;font-size:10px;">
      Managed serverless services. The Bot Runtime calls these via HTTPS over Microsoft's network.
    </text>

    <!-- ============================== ZONE: BOT RUNTIME ============================== -->
    <rect x="40" y="400" width="1020" height="280" class="zone zone-bot"/>
    <text x="56" y="422" class="zone-title" fill="#0369a1">BOT RUNTIME · Docker Environment (Azure VM / Ubuntu)</text>

    <!-- Main Bot Service -->
    <g transform="translate(370, 442)">
      <rect width="360" height="60" class="node n-bot"/>
      <rect x="0" y="0" width="4" height="60" class="bar bar-bot"/>
      <text x="20" y="24" class="n-title">ASP.NET Core Web API · Bot Service</text>
      <text x="20" y="40" class="n-sub">Bot Framework SDK · Dialog Orchestrator</text>
      <text x="20" y="54" class="n-sub">Function Registry · Adaptive Card Renderer</text>
    </g>

    <!-- Sub-services row -->
    <g transform="translate(80, 545)">
      <rect width="180" height="50" class="node n-bot"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-bot"/>
      <text x="20" y="22" class="n-title">Hangfire</text>
      <text x="20" y="38" class="n-sub">Job Scheduler</text>
    </g>

    <g transform="translate(290, 545)">
      <rect width="200" height="50" class="node n-bot"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-bot"/>
      <text x="20" y="22" class="n-title">AI Orchestration</text>
      <text x="20" y="38" class="n-sub">NL → OData Mapping</text>
    </g>

    <g transform="translate(520, 545)">
      <rect width="200" height="50" class="node n-bot"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-bot"/>
      <text x="20" y="22" class="n-title">SAP Client</text>
      <text x="20" y="38" class="n-sub">HTTP · Polly Retry · CSRF</text>
    </g>

    <!-- Data stores -->
    <g transform="translate(750, 545)">
      <rect width="135" height="50" class="node n-data"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-data"/>
      <text x="20" y="22" class="n-title">PostgreSQL</text>
      <text x="20" y="38" class="n-sub">State · Audit</text>
    </g>

    <g transform="translate(910, 545)">
      <rect width="130" height="50" class="node n-data"/>
      <rect x="0" y="0" width="4" height="50" class="bar bar-data"/>
      <text x="20" y="22" class="n-title">Redis</text>
      <text x="20" y="38" class="n-sub">Cache · Tokens</text>
    </g>

    <!-- Bot caption -->
    <text x="80" y="635" class="n-sub" style="font-style:italic;font-size:10px;">
      Containerized .NET runtime. Sub-services run in-process within the Bot Service; data stores run as sidecar containers.
    </text>

    <!-- ============================== ZONE: SAP ON-PREMISE ============================== -->
    <rect x="40" y="720" width="1020" height="160" class="zone zone-sap"/>
    <text x="56" y="742" class="zone-title" fill="#9a3412">ON-PREMISE · SAP S/4HANA System S40 (UCC Network)</text>

    <!-- Cloud Connector -->
    <g transform="translate(80, 762)">
      <rect width="170" height="60" class="node n-sap"/>
      <rect x="0" y="0" width="4" height="60" class="bar bar-sap"/>
      <text x="20" y="22" class="n-title">SAP Cloud Connector</text>
      <text x="20" y="38" class="n-sub">Reverse-invoke tunnel</text>
      <text x="20" y="52" class="n-sub">(DMZ host)</text>
    </g>

    <!-- OData -->
    <g transform="translate(280, 762)">
      <rect width="180" height="60" class="node n-sap"/>
      <rect x="0" y="0" width="4" height="60" class="bar bar-sap"/>
      <text x="20" y="22" class="n-title">RAP OData V4 Service</text>
      <text x="20" y="38" class="n-sub">Service Definition</text>
      <text x="20" y="52" class="n-sub">+ Service Binding</text>
    </g>

    <!-- CDS -->
    <g transform="translate(490, 762)">
      <rect width="200" height="60" class="node n-sap"/>
      <rect x="0" y="0" width="4" height="60" class="bar bar-sap"/>
      <text x="20" y="22" class="n-title">CDS Aggregation Views</text>
      <text x="20" y="38" class="n-sub">+ AMDP Procedures</text>
      <text x="20" y="52" class="n-sub">(HANA SQLScript)</text>
    </g>

    <!-- Z-Tables -->
    <g transform="translate(720, 762)">
      <rect width="160" height="60" class="node n-sap"/>
      <rect x="0" y="0" width="4" height="60" class="bar bar-sap"/>
      <text x="20" y="22" class="n-title">Z-Tables · HANA DB</text>
      <text x="20" y="38" class="n-sub">KPI Snapshots</text>
      <text x="20" y="52" class="n-sub">Audit Logs</text>
    </g>

    <!-- Background Jobs -->
    <g transform="translate(910, 762)">
      <rect width="130" height="60" class="node n-sap"/>
      <rect x="0" y="0" width="4" height="60" class="bar bar-sap"/>
      <text x="20" y="22" class="n-title">Background Jobs</text>
      <text x="20" y="38" class="n-sub">6h KPI refresh</text>
      <text x="20" y="52" class="n-sub">(SM37)</text>
    </g>

    <!-- ============================== EDGES ============================== -->

    <!-- ① Client → Bot Connector -->
    <path d="M 550 125 L 550 165 L 170 165 L 170 220" class="edge" marker-end="url(#arr)"/>
    <circle cx="320" cy="165" r="9" class="flow-badge"/>
    <text x="320" y="165" class="flow-num">1</text>
    <rect class="edge-label-bg" x="335" y="158" width="125" height="13"/>
    <text x="397" y="168" text-anchor="middle" class="edge-label">user msg / card</text>

    <!-- ② Bot Connector → Bot Service -->
    <path d="M 170 270 L 170 370 L 550 370 L 550 442" class="edge" marker-end="url(#arr)"/>
    <circle cx="340" cy="370" r="9" class="flow-badge"/>
    <text x="340" y="370" class="flow-num">2</text>
    <rect class="edge-label-bg" x="355" y="363" width="115" height="13"/>
    <text x="412" y="373" text-anchor="middle" class="edge-label">bot activity (HTTPS)</text>

    <!-- Bot Service → Entra (auth) -->
    <path d="M 460 442 L 460 380 L 370 380 L 370 270" class="edge" marker-end="url(#arr)"/>
    <text x="380" y="396" class="edge-label">auth</text>

    <!-- ③ AI Orch → Azure OpenAI -->
    <path d="M 390 545 L 390 390 L 570 390 L 570 270" class="edge" marker-end="url(#arr)"/>
    <circle cx="390" cy="475" r="9" class="flow-badge"/>
    <text x="390" y="475" class="flow-num">3</text>
    <rect class="edge-label-bg" x="403" y="468" width="105" height="13"/>
    <text x="455" y="478" text-anchor="middle" class="edge-label">function call</text>

    <!-- Bot → Graph -->
    <path d="M 640 442 L 640 380 L 770 380 L 770 270" class="edge" marker-end="url(#arr)"/>
    <text x="745" y="396" class="edge-label">mail</text>

    <!-- Bot → Azure Functions -->
    <path d="M 700 442 L 700 392 L 960 392 L 960 270" class="edge" marker-end="url(#arr)"/>
    <text x="900" y="408" class="edge-label">PDF gen</text>

    <!-- Bot ↔ Hangfire -->
    <path d="M 460 502 L 460 530 L 170 530 L 170 545" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- Bot ↔ AI Orch -->
    <path d="M 540 502 L 540 520 L 390 520 L 390 545" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- Bot ↔ SAP Client -->
    <path d="M 620 502 L 620 545" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- Bot ↔ PostgreSQL -->
    <path d="M 700 502 L 700 520 L 817 520 L 817 545" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- Bot ↔ Redis -->
    <path d="M 720 502 L 720 510 L 975 510 L 975 545" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- Hangfire ↔ Postgres (job state) -->
    <path d="M 170 595 L 170 615 L 817 615 L 817 595" class="edge-light"/>
    <text x="485" y="611" text-anchor="middle" class="edge-label" style="fill:#94a3b8">hangfire job state</text>

    <!-- ④ SAP Client → Cloud Connector -->
    <path d="M 620 595 L 620 700 L 165 700 L 165 762" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <circle cx="400" cy="700" r="9" class="flow-badge"/>
    <text x="400" y="700" class="flow-num">4</text>
    <rect class="edge-label-bg" x="415" y="693" width="190" height="13"/>
    <text x="510" y="703" text-anchor="middle" class="edge-label">OData V4 via reverse-invoke tunnel</text>

    <!-- ⑤ Cloud Connector → OData Service -->
    <path d="M 250 792 L 280 792" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- OData → CDS -->
    <path d="M 460 792 L 490 792" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- CDS → Z-Tables -->
    <path d="M 690 792 L 720 792" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>

    <!-- Background Jobs → Z-Tables -->
    <path d="M 910 792 L 880 792" class="edge" marker-end="url(#arr)"/>

  </svg>

  <div class="footer">
    <div><b style="color:#1f2933;">AISO-Teams</b> · System Architecture v1.2</div>
    <div>Numbered flow ①–④ traces a single user query end-to-end</div>
  </div>
</div>
</body>
</html>
